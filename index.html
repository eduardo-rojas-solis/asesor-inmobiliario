<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Esta línea le pide a Google que NO muestre la página en sus resultados
       mientras queden datos [PENDIENTE]. Cuando todo esté completo, bórrela. -->

  <title>Eduardo Rojas Solís · Corredor de propiedades</title>

  <!-- Hoja de estilos (colores, tamaños y ordenamiento de la página) -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <main>

    <!-- ================= 1. TARJETA DE PRESENTACIÓN ================= -->
    <header class="tarjeta" id="inicio">

      <div class="tarjeta__foto">
        <!-- ✏️ FOTO DE EDUARDO
             1. Suba la foto a la carpeta assets/perfil con el nombre foto-eduardo.jpg
             2. Borre el bloque <div class="foto-pendiente">...</div> de abajo.
             3. En la línea <img ...> de más abajo, borre los símbolos de comentario
                del inicio y del final (vea el README, sección «Cambiar la foto»). -->
        <div class="foto-pendiente">
          <span class="pendiente">[PENDIENTE: fotografía profesional de Eduardo]</span>
        </div>
        <!-- <img src="assets/perfil/foto-eduardo.jpg" alt="Fotografía de Eduardo Rojas Solís"> -->
      </div>

      <div class="tarjeta__texto">
        <h1>Eduardo Rojas Solís</h1>
        <p class="tarjeta__rol">Corredor de propiedades</p>

        <!-- ✏️ FRASE DE PRESENTACIÓN: reemplace todo el <span> por el texto final. -->
        <p class="tarjeta__intro">
          <span class="pendiente">[PENDIENTE: frase breve de presentación, de 1 o 2 líneas]</span>
        </p>
      </div>

    </header>

  </main>

  <!-- ====================== PIE DE PÁGINA ====================== -->
  <footer class="pie">
    <p>Eduardo Rojas Solís · Corredor de propiedades</p>
  </footer>
